name: 自動更新（股價/新聞/千張）

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 09:00 TST prices
    - cron: '0 7 * * 1-5'   # 15:00 TST prices
    - cron: '0 0 * * *'     # 08:00 TST news
    - cron: '0 2 * * 6'     # 10:00 TST holders (Sat)
  workflow_dispatch:
    inputs:
      task:
        description: '執行項目'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'prices', 'news', 'holders']

concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-prices:
    if: github.event_name == 'schedule' && (github.event.schedule == '0 1 * * 1-5' || github.event.schedule == '0 7 * * 1-5') || github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'prices' || github.event.inputs.task == 'all')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run + Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || git pull origin main || true
            python update_prices.py
            git add date.json status.json
            if git diff --staged --quiet; then
              echo "No changes, skipping"; break
            fi
            MSG="自動更新股價 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
            git commit -m "$MSG"
            if git push 2>&1; then
              echo "✅ Push success"; break
            fi
            echo "⚠️ Retry $i"
            git reset --soft HEAD~1
            git restore --staged .
            sleep 3
          done

  update-news:
    needs: update-prices
    if: |
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'news' || github.event.inputs.task == 'all'))
      )
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run + Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || git pull origin main || true
            python update_news.py
            git add news_status.json status.json
            if git diff --staged --quiet; then
              echo "No changes, skipping"; break
            fi
            MSG="每日新聞掃描 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
            git commit -m "$MSG"
            if git push 2>&1; then
              echo "✅ Push success"; break
            fi
            echo "⚠️ Retry $i"
            git reset --soft HEAD~1
            git restore --staged .
            sleep 3
          done

  update-holders:
    needs: update-news
    if: |
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'holders' || github.event.inputs.task == 'all'))
      )
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run + Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || git pull origin main || true
            python update_holders.py
            git add holders.json holders_history.json status.json
            if git diff --staged --quiet; then
              echo "No changes, skipping"; break
            fi
            MSG="自動更新千張大戶統計 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
            git commit -m "$MSG"
            if git push 2>&1; then
              echo "✅ Push success"; break
            fi
            echo "⚠️ Retry $i"
            git reset --soft HEAD~1
            git restore --staged .
            sleep 3
          done
